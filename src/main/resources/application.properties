spring.application.name=psg_backEnd

server.address=0.0.0.0
server.port=${SERVER_PORT:8081}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://24.232.204.224:4200}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== Actuator (common) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===== SpringDoc OpenAPI 3 Configuration =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=PSG.backEnd.controller

logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG
