spring.application.name=psg_backEnd

server.address=0.0.0.0
server.port=${SERVER_PORT:8081}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://24.232.204.224:4200}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== Actuator (common) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===== SpringDoc OpenAPI 3 Configuration =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=PSG.backEnd.controller

logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG

# ===== JWT Configuration =====
# IMPORTANT: Set these values via environment variables or .env files
# For development: Use .env.dev.template as reference
# For production: Generate secure values with generate-secure-env.ps1
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===== Flyway Configuration =====
# Enables automatic database migrations on startup
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ===== Multipart File Upload =====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== Password Policy =====
# Defense-in-depth: structural rules + denylist + online breach check (HIBP).
# HIBP uses k-anonymity (only first 5 chars of SHA-1 hash leave the server).
# Disable only for offline/dev environments.
app.security.password.hibp-enabled=${APP_SECURITY_PASSWORD_HIBP_ENABLED:true}
app.security.password.hibp-timeout-ms=${APP_SECURITY_PASSWORD_HIBP_TIMEOUT_MS:2500}

# ===== Resend (Email transaccional) =====
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:noreply@civilcontrol.app}
resend.from-name=${RESEND_FROM_NAME:CivilControl}

# ===== WhatsApp Cloud API (Meta) =====
whatsapp.cloud-api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
whatsapp.cloud-api.phone-number-id=${WHATSAPP_PHONE_ID:}
whatsapp.cloud-api.access-token=${WHATSAPP_ACCESS_TOKEN:}

# ===== Rate Limiting (auth endpoints) =====
# IP-based token bucket: requests/minute per remote address on /auth/login and /auth/refresh
app.security.ratelimit.ip.requests=${APP_SECURITY_RATELIMIT_IP_REQUESTS:5}
# Per-username failed attempts before temporary lockout
app.security.ratelimit.lockout.threshold=${APP_SECURITY_RATELIMIT_LOCKOUT_THRESHOLD:10}
# Lockout duration in minutes
app.security.ratelimit.lockout.duration-minutes=${APP_SECURITY_RATELIMIT_LOCKOUT_DURATION_MINUTES:15}
