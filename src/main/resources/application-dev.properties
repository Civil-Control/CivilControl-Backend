# ===== Database Configuration =====
# Uses environment variables when available, falls back to defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/psg_backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/Hibernate Configuration =====
# Flyway handles schema changes - Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT Configuration (Development Only) =====
# WARNING: These are development-only values. NEVER use in production!
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===== Logging Configuration =====
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG

# ===== Flyway Configuration =====
# The database already had a pre-existing schema created by Hibernate (previous ddl-auto).
# baseline-version=1 tells Flyway to treat V1 as already applied.
# Only scripts V2 and above will be executed.
# repair-on-migrate=true: in DEV, automatically repairs checksums if a script was edited.
# validate-on-migrate=false: disabled in DEV to avoid conflicts with repair-on-migrate.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

